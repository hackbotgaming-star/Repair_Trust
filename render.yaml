services:
  - type: web
    name: repairtrust-platform
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:8000
